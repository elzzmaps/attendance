<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Attendance</title>
<style>
:root{
  --bg:#0b0f19;
  --surface:#151d2e;
  --surface-2:#1b2437;
  --line:rgba(255,255,255,.07);
  --text:#e8edf7;
  --muted:#8b97ad;
  --accent:#5b8cff;
  --violet:#8b5cf6;
  --green:#22c55e;
  --amber:#f59e0b;
  --red:#ef4444;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
body::before{
  content:'';
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(620px 420px at 8% -8%, rgba(91,140,255,.20), transparent 62%),
    radial-gradient(560px 420px at 108% 6%, rgba(139,92,246,.16), transparent 62%),
    radial-gradient(700px 500px at 50% 110%, rgba(34,197,94,.07), transparent 60%);
}

/* ---------- Layout ---------- */
.app{
  position:relative;z-index:1;
  max-width:560px;margin:0 auto;
  min-height:100dvh;
}

/* ---------- Topbar ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;
  background:rgba(11,15,25,.72);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  backdrop-filter:blur(20px) saturate(160%);
  border-bottom:1px solid rgba(255,255,255,.05);
}
.brand{display:flex;align-items:center;gap:11px;}
.logo{
  width:40px;height:40px;border-radius:13px;flex-shrink:0;
  display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--violet));
  box-shadow:0 8px 22px rgba(91,140,255,.35);
}
.topbar h1{
  margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em;
}
.clock{
  font-size:11.5px;color:var(--muted);font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:.02em;
  display:flex;align-items:center;gap:6px;margin-top:1px;
}
.clock .dot{
  width:6px;height:6px;border-radius:50%;background:var(--green);
  box-shadow:0 0 0 0 rgba(34,197,94,.6);
  animation:pulse 2s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(34,197,94,.55);}
  70%{box-shadow:0 0 0 8px rgba(34,197,94,0);}
  100%{box-shadow:0 0 0 0 rgba(34,197,94,0);}
}
.icon-btn{
  width:40px;height:40px;flex-shrink:0;
  display:grid;place-items:center;
  border-radius:13px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);color:#c4d0e4;
  cursor:pointer;transition:.18s;
}
.icon-btn:active{transform:scale(.92);background:rgba(255,255,255,.09);}

/* ---------- Content ---------- */
.content{padding:14px 16px calc(140px + env(safe-area-inset-bottom));}

/* ---------- Date bar ---------- */
.datebar{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.035);
  border:1px solid var(--line);
  border-radius:17px;padding:6px;
  margin-bottom:12px;
}
.datebar .nav{
  width:42px;height:42px;flex-shrink:0;
  display:grid;place-items:center;
  border-radius:13px;border:none;
  background:rgba(255,255,255,.05);color:#cfd9ea;
  font-size:20px;line-height:1;cursor:pointer;transition:.18s;
  font-family:inherit;
}
.datebar .nav:active{transform:scale(.9);background:rgba(255,255,255,.1);}
.datebar .nav:disabled{opacity:.25;pointer-events:none;}
.date-display{flex:1;text-align:center;min-width:0;}
.date-display strong{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.01em;}
.date-display span{display:block;font-size:11px;color:var(--muted);margin-top:1px;font-weight:500;}

/* ---------- Stats ---------- */
.stats{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  margin-bottom:14px;
}
.stat{
  background:rgba(255,255,255,.035);
  border:1px solid var(--line);
  border-radius:15px;
  padding:11px 4px 9px;
  text-align:center;
}
.stat b{display:block;font-size:19px;font-weight:800;letter-spacing:-.03em;line-height:1;}
.stat span{
  display:block;margin-top:5px;
  font-size:9px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.07em;font-weight:700;
}
.stat.present b{color:#4ade80;}
.stat.half b{color:#fbbf24;}
.stat.absent b{color:#f87171;}
.stat.unmarked b{color:#94a3b8;}

/* ---------- Search ---------- */
.search{position:relative;margin-bottom:14px;}
.search svg{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  color:#64748b;pointer-events:none;
}
.search input{
  width:100%;
  padding:13px 14px 13px 41px;
  border-radius:15px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--line);
  color:var(--text);font-size:15px;font-family:inherit;
  outline:none;transition:.2s;
}
.search input::placeholder{color:#5c6a80;}
.search input:focus{
  border-color:rgba(91,140,255,.55);
  background:rgba(91,140,255,.06);
  box-shadow:0 0 0 4px rgba(91,140,255,.09);
}

/* ---------- Cards ---------- */
.card{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;
  margin-bottom:9px;
  border-radius:18px;
  background:linear-gradient(180deg,#161f31,#121a28);
  border:1px solid var(--line);
  cursor:pointer;
  transition:transform .14s ease, border-color .2s, background .2s;
  animation:rise .32s cubic-bezier(.22,1,.36,1) both;
}
@keyframes rise{
  from{opacity:0;transform:translateY(9px);}
  to{opacity:1;transform:translateY(0);}
}
.card:active{transform:scale(.978);border-color:rgba(255,255,255,.14);}
.avatar{
  width:45px;height:45px;flex-shrink:0;
  border-radius:15px;
  display:grid;place-items:center;
  font-weight:800;font-size:15px;letter-spacing:.02em;
  color:#dbe6fb;
  border:1px solid rgba(255,255,255,.07);
}
.card .info{flex:1;min-width:0;}
.card .name{
  font-size:15px;font-weight:650;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.card .meta{
  font-size:11.5px;color:var(--muted);margin-top:2.5px;font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-variant-numeric:tabular-nums;
}
.card .reason{
  font-size:11px;color:#f0a3a3;margin-top:3px;font-style:italic;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.pill{
  flex-shrink:0;
  font-size:10.5px;font-weight:800;
  padding:6px 10px;border-radius:999px;
  letter-spacing:.02em;white-space:nowrap;
}
.pill.present{background:rgba(34,197,94,.15);color:#4ade80;}
.pill.half{background:rgba(245,158,11,.15);color:#fbbf24;}
.pill.absent{background:rgba(239,68,68,.15);color:#f87171;}
.pill.none{background:rgba(255,255,255,.05);color:#5f6d82;}

/* ---------- Empty ---------- */
.empty{
  text-align:center;padding:52px 24px;
  animation:rise .35s ease both;
}
.empty-icon{font-size:38px;margin-bottom:12px;opacity:.85;}
.empty h3{margin:0 0 6px;font-size:16px;font-weight:700;}
.empty p{margin:0;font-size:13px;color:var(--muted);line-height:1.5;}

/* ---------- FAB ---------- */
.fab{
  position:fixed;
  right:max(18px, calc(50% - 280px + 18px));
  bottom:calc(24px + env(safe-area-inset-bottom));
  width:60px;height:60px;z-index:30;
  border-radius:20px;border:none;
  background:linear-gradient(135deg,var(--accent),var(--violet));
  color:#fff;font-size:30px;font-weight:300;line-height:1;
  display:grid;place-items:center;padding-bottom:3px;
  box-shadow:0 14px 32px rgba(91,140,255,.42), 0 2px 8px rgba(0,0,0,.4);
  cursor:pointer;transition:transform .18s cubic-bezier(.34,1.56,.64,1);
}
.fab:active{transform:scale(.9);}

/* ---------- Overlay & Sheets ---------- */
.overlay{
  position:fixed;inset:0;z-index:50;
  background:rgba(3,6,12,.68);
  -webkit-backdrop-filter:blur(3px);
  backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .28s;
}
.overlay.open{opacity:1;pointer-events:auto;}

.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  max-width:560px;margin:0 auto;
  max-height:92dvh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  background:linear-gradient(180deg,#182135,#131b2a);
  border-radius:28px 28px 0 0;
  border-top:1px solid rgba(255,255,255,.09);
  padding:10px 20px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(105%);
  transition:transform .38s cubic-bezier(.32,.72,0,1);
  box-shadow:0 -20px 60px rgba(0,0,0,.55);
}
.sheet.open{transform:translateY(0);}
.handle{
  width:38px;height:4px;border-radius:99px;
  background:rgba(255,255,255,.18);
  margin:0 auto 16px;
}

.sheet-head{display:flex;align-items:center;gap:13px;margin-bottom:4px;}
.sheet-head .avatar{width:52px;height:52px;border-radius:17px;font-size:17px;}
.sheet-head .who{flex:1;min-width:0;}
.sheet-head h2{
  margin:0;font-size:17.5px;font-weight:700;letter-spacing:-.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sheet-head p{margin:3px 0 0;font-size:12.5px;color:var(--muted);font-weight:500;}
.pencil{
  width:38px;height:38px;flex-shrink:0;
  display:grid;place-items:center;border-radius:12px;
  border:1px solid var(--line);background:rgba(255,255,255,.04);
  color:#a9b6cc;cursor:pointer;transition:.18s;
}
.pencil:active{transform:scale(.9);background:rgba(255,255,255,.1);}

.sheet-title{
  margin:0 0 16px;font-size:17px;font-weight:750;letter-spacing:-.02em;
}

/* ---------- Status picker ---------- */
.status-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:9px;
  margin:18px 0 4px;
}
.status-btn{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:14px 6px;border-radius:17px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.03);
  color:#98a5ba;font-size:12px;font-weight:700;
  font-family:inherit;cursor:pointer;
  transition:.2s;
}
.status-btn .dot{width:9px;height:9px;border-radius:50%;}
.status-btn[data-status="present"] .dot{background:var(--green);}
.status-btn[data-status="half"] .dot{background:var(--amber);}
.status-btn[data-status="absent"] .dot{background:var(--red);}
.status-btn:active{transform:scale(.96);}
.status-btn.active[data-status="present"]{
  background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.5);color:#4ade80;
  box-shadow:0 0 0 3px rgba(34,197,94,.08);
}
.status-btn.active[data-status="half"]{
  background:rgba(245,158,11,.14);border-color:rgba(245,158,11,.5);color:#fbbf24;
  box-shadow:0 0 0 3px rgba(245,158,11,.08);
}
.status-btn.active[data-status="absent"]{
  background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.5);color:#f87171;
  box-shadow:0 0 0 3px rgba(239,68,68,.08);
}

/* ---------- Fields ---------- */
.field{margin-top:16px;animation:fadeUp .28s ease both;}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(7px);}
  to{opacity:1;transform:translateY(0);}
}
.field label{
  display:block;font-size:11px;font-weight:800;
  text-transform:uppercase;letter-spacing:.08em;
  color:var(--muted);margin-bottom:8px;
}
.field textarea,
.field input{
  width:100%;
  padding:13px 14px;
  border-radius:15px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--line);
  color:var(--text);font-size:15px;font-family:inherit;
  outline:none;transition:.2s;
  resize:none;
}
.field textarea{min-height:78px;line-height:1.45;}
.field input:focus,.field textarea:focus{
  border-color:rgba(91,140,255,.55);
  background:rgba(91,140,255,.06);
  box-shadow:0 0 0 4px rgba(91,140,255,.09);
}
.field input::placeholder,.field textarea::placeholder{color:#5c6a80;}

.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px;}
.chip{
  padding:7px 12px;border-radius:999px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.04);
  color:#9aa8bd;font-size:12px;font-weight:600;
  font-family:inherit;cursor:pointer;transition:.18s;
}
.chip:active{transform:scale(.94);background:rgba(91,140,255,.16);color:#9ec0ff;}

/* ---------- Actions ---------- */
.actions{
  display:flex;gap:10px;margin-top:24px;
}
.btn{
  flex:1;
  padding:15px 16px;
  border-radius:16px;border:none;
  font-size:14.5px;font-weight:750;
  font-family:inherit;cursor:pointer;
  transition:transform .15s, opacity .2s, background .2s;
}
.btn:active{transform:scale(.97);}
.btn.primary{
  background:linear-gradient(135deg,var(--accent),var(--violet));
  color:#fff;
  box-shadow:0 10px 26px rgba(91,140,255,.32);
}
.btn.ghost{
  background:rgba(255,255,255,.05);
  border:1px solid var(--line);
  color:#a9b6cc;
  flex:0 0 auto;
  padding-left:22px;padding-right:22px;
}
.btn.danger{
  background:rgba(239,68,68,.12);
  border:1px solid rgba(239,68,68,.34);
  color:#f87171;
}
.btn.danger.armed{
  background:var(--red);
  border-color:var(--red);
  color:#fff;
  animation:shake .35s;
}
@keyframes shake{
  0%,100%{transform:translateX(0);}
  25%{transform:translateX(-5px);}
  75%{transform:translateX(5px);}
}
.btn-row{display:flex;gap:10px;margin-top:12px;}

/* ---------- Toast ---------- */
.toast{
  position:fixed;left:50%;
  bottom:calc(104px + env(safe-area-inset-bottom));
  transform:translate(-50%,16px);
  opacity:0;pointer-events:none;z-index:120;
  background:rgba(30,42,62,.96);
  -webkit-backdrop-filter:blur(14px);
  backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.1);
  color:#e8edf7;
  padding:12px 20px;border-radius:15px;
  font-size:13px;font-weight:650;white-space:nowrap;
  box-shadow:0 14px 36px rgba(0,0,0,.5);
  transition:all .3s cubic-bezier(.22,1,.36,1);
  max-width:88vw;overflow:hidden;text-overflow:ellipsis;
}
.toast.show{opacity:1;transform:translate(-50%,0);}

/* ---------- Hide reason field ---------- */
.hidden{display:none !important;}
</style>
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6L9 17l-5-5"/>
        </svg>
      </div>
      <div>
        <h1>Attendance</h1>
        <div class="clock"><span class="dot"></span><span id="clock">--:--:--</span></div>
      </div>
    </div>
    <button class="icon-btn" id="exportBtn" aria-label="Export CSV">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
        <path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>
      </svg>
    </button>
  </header>

  <div class="content">

    <!-- Date navigator -->
    <div class="datebar">
      <button class="nav" id="prevDay" aria-label="Previous day">‹</button>
      <div class="date-display">
        <strong id="dateLabel">Today</strong>
        <span id="dateSub">—</span>
      </div>
      <button class="nav" id="nextDay" aria-label="Next day">›</button>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat present"><b id="cPresent">0</b><span>Present</span></div>
      <div class="stat half"><b id="cHalf">0</b><span>Half</span></div>
      <div class="stat absent"><b id="cAbsent">0</b><span>Absent</span></div>
      <div class="stat unmarked"><b id="cUnmarked">0</b><span>Unmarked</span></div>
    </div>

    <!-- Search -->
    <div class="search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/>
      </svg>
      <input id="search" type="search" placeholder="Search employees…" autocomplete="off">
    </div>

    <!-- Employee list -->
    <div id="list"></div>

  </div>

  <button class="fab" id="addBtn" aria-label="Add employee">+</button>
</div>

<!-- Overlay -->
<div class="overlay" id="overlay"></div>

<!-- Attendance sheet -->
<div class="sheet" id="attSheet">
  <div class="handle"></div>

  <div class="sheet-head">
    <div class="avatar" id="attAvatar">—</div>
    <div class="who">
      <h2 id="attName">Employee</h2>
      <p id="attRole">Employee</p>
    </div>
    <button class="pencil" id="editEmpBtn" aria-label="Edit employee">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9"/>
        <path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/>
      </svg>
    </button>
  </div>

  <div class="status-grid" id="statusGrid">
    <button class="status-btn" data-status="present"><span class="dot"></span>Present</button>
    <button class="status-btn" data-status="half"><span class="dot"></span>Half Day</button>
    <button class="status-btn" data-status="absent"><span class="dot"></span>Absent</button>
  </div>

  <div class="field hidden" id="reasonField">
    <label>Reason for absence</label>
    <textarea id="reasonInput" placeholder="e.g. Sick leave, family emergency…"></textarea>
    <div class="chips">
      <button class="chip" data-reason="Sick leave">Sick leave</button>
      <button class="chip" data-reason="Vacation leave">Vacation</button>
      <button class="chip" data-reason="Family emergency">Emergency</button>
      <button class="chip" data-reason="Personal reasons">Personal</button>
      <button class="chip" data-reason="Official business">Official</button>
    </div>
  </div>

  <div class="field">
    <label>Timestamp</label>
    <input type="time" id="timeInput">
  </div>

  <div class="actions">
    <button class="btn ghost" id="clearAttBtn">Clear</button>
    <button class="btn primary" id="saveAttBtn">Save Entry</button>
  </div>
</div>

<!-- Employee sheet -->
<div class="sheet" id="empSheet">
  <div class="handle"></div>
  <h2 class="sheet-title" id="empSheetTitle">Add Employee</h2>

  <div class="field" style="margin-top:0">
    <label>Full name</label>
    <input id="empName" type="text" placeholder="e.g. Juan Dela Cruz" autocomplete="off">
  </div>

  <div class="field">
    <label>Position / Department <span style="text-transform:none;letter-spacing:0;font-weight:600">(optional)</span></label>
    <input id="empRole" type="text" placeholder="e.g. Cashier — Sales" autocomplete="off">
  </div>

  <div class="btn-row">
    <button class="btn ghost" id="cancelEmpBtn" style="flex:1">Cancel</button>
    <button class="btn primary" id="saveEmpBtn" style="flex:1.4">Save</button>
  </div>
  <div class="btn-row">
    <button class="btn danger" id="deleteEmpBtn" style="flex:1">Delete Employee</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  /* =========================================================
     Utilities
     ========================================================= */
  const $  = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));

  const buzz = (ms = 8) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

  const STATUS = {
    present: { label: 'Present',  short: 'Present'  },
    half:    { label: 'Half Day', short: 'Half Day' },
    absent:  { label: 'Absent',   short: 'Absent'   }
  };

  /* ---- Date helpers ---- */
  function dateKey(d = new Date()) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }
  function parseKey(k) {
    const [y, m, d] = k.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  function shiftDate(k, delta) {
    const d = parseKey(k);
    d.setDate(d.getDate() + delta);
    return dateKey(d);
  }
  function nowTime() {
    const d = new Date();
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  function formatTime(t) {
    if (!t) return '';
    const [h, m] = t.split(':').map(Number);
    const ap = h >= 12 ? 'PM' : 'AM';
    const hh = h % 12 || 12;
    return `${hh}:${String(m).padStart(2, '0')} ${ap}`;
  }

  function initials(name) {
    const parts = String(name).trim().split(/\s+/).filter(Boolean).slice(0, 2);
    if (!parts.length) return '?';
    return parts.map(p => p[0]).join('').toUpperCase();
  }
  function hueOf(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360;
    return h;
  }

  /* =========================================================
     Data layer
     ========================================================= */
  const STORE_KEY = 'attendanceApp.v1';
  let db = { employees: [], records: {} };

  function loadData() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object') {
          db.employees = Array.isArray(parsed.employees) ? parsed.employees : [];
          db.records   = parsed.records && typeof parsed.records === 'object' ? parsed.records : {};
        }
      }
    } catch (e) {
      console.warn('Could not read saved data', e);
    }
  }
  function saveData() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(db));
    } catch (e) {
      toast('Storage full — could not save');
    }
  }

  function getRecord(empId, dateK = currentDate) {
    const day = db.records[dateK];
    return (day && day[empId]) || null;
  }
  function setRecord(empId, rec, dateK = currentDate) {
    if (!db.records[dateK]) db.records[dateK] = {};
    if (rec) db.records[dateK][empId] = rec;
    else delete db.records[dateK][empId];
    if (!Object.keys(db.records[dateK]).length) delete db.records[dateK];
    saveData();
  }

  /* =========================================================
     App state
     ========================================================= */
  let currentDate  = dateKey();
  let searchQuery  = '';
  let activeEmpId  = null;
  let editingId    = null;
  let pickedStatus = null;
  let deleteArmed  = false;
  let deleteTimer  = null;

  /* =========================================================
     DOM refs
     ========================================================= */
  const listEl      = $('#list');
  const overlay     = $('#overlay');
  const attSheet    = $('#attSheet');
  const empSheet    = $('#empSheet');
  const toastEl     = $('#toast');

  const clockEl     = $('#clock');
  const dateLabel   = $('#dateLabel');
  const dateSub     = $('#dateSub');
  const prevDayBtn  = $('#prevDay');
  const nextDayBtn  = $('#nextDay');

  const attAvatar   = $('#attAvatar');
  const attName     = $('#attName');
  const attRole     = $('#attRole');
  const statusGrid  = $('#statusGrid');
  const reasonField = $('#reasonField');
  const reasonInput = $('#reasonInput');
  const timeInput   = $('#timeInput');

  const empSheetTitle = $('#empSheetTitle');
  const empNameIn     = $('#empName');
  const empRoleIn     = $('#empRole');
  const deleteEmpBtn  = $('#deleteEmpBtn');

  /* =========================================================
     Toast
     ========================================================= */
  let toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2100);
  }

  /* =========================================================
     Sheet management
     ========================================================= */
  function openSheet(el) {
    overlay.classList.add('open');
    el.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeSheets() {
    overlay.classList.remove('open');
    [attSheet, empSheet].forEach(s => s.classList.remove('open'));
    document.body.style.overflow = '';
  }
  overlay.addEventListener('click', closeSheets);

  /* =========================================================
     Rendering
     ========================================================= */
  function renderDate() {
    const today = dateKey();
    const d = parseKey(currentDate);
    const isToday = currentDate === today;
    const isYesterday = currentDate === shiftDate(today, -1);

    if (isToday) dateLabel.textContent = 'Today';
    else if (isYesterday) dateLabel.textContent = 'Yesterday';
    else dateLabel.textContent = d.toLocaleDateString(undefined, { weekday: 'long' });

    dateSub.textContent = d.toLocaleDateString(undefined, {
      month: 'long', day: 'numeric', year: 'numeric'
    });

    nextDayBtn.disabled = currentDate >= today;
  }

  function renderStats() {
    const day = db.records[currentDate] || {};
    let p = 0, h = 0, a = 0;
    db.employees.forEach(e => {
      const r = day[e.id];
      if (!r) return;
      if (r.status === 'present') p++;
      else if (r.status === 'half') h++;
      else if (r.status === 'absent') a++;
    });
    const un = Math.max(0, db.employees.length - p - h - a);
    $('#cPresent').textContent  = p;
    $('#cHalf').textContent     = h;
    $('#cAbsent').textContent   = a;
    $('#cUnmarked').textContent = un;
  }

  function renderList() {
    if (!db.employees.length) {
      listEl.innerHTML = `
        <div class="empty">
          <div class="empty-icon">👥</div>
          <h3>No employees yet</h3>
          <p>Tap the <strong>+</strong> button to add your first team member and start logging attendance.</p>
        </div>`;
      return;
    }

    const q = searchQuery.trim().toLowerCase();
    const emps = db.employees
      .filter(e => !q ||
        e.name.toLowerCase().includes(q) ||
        (e.role || '').toLowerCase().includes(q))
      .sort((a, b) => a.name.localeCompare(b.name));

    if (!emps.length) {
      listEl.innerHTML = `
        <div class="empty">
          <div class="empty-icon">🔍</div>
          <h3>No matches</h3>
          <p>No employee matches “${esc(searchQuery)}”.</p>
        </div>`;
      return;
    }

    const day = db.records[currentDate] || {};

    listEl.innerHTML = emps.map((e, i) => {
      const rec = day[e.id];
      const hue = hueOf(e.name);
      const st  = rec ? STATUS[rec.status] : null;

      const metaParts = [];
      if (e.role) metaParts.push(esc(e.role));
      if (rec && rec.time) metaParts.push(esc(formatTime(rec.time)));
      const meta = metaParts.length ? metaParts.join(' · ') : 'Not marked';

      return `
        <article class="card" data-id="${e.id}" style="animation-delay:${Math.min(i * 26, 220)}ms">
          <div class="avatar" style="background:linear-gradient(135deg, hsl(${hue} 52% 33%), hsl(${(hue + 48) % 360} 48% 20%))">
            ${esc(initials(e.name))}
          </div>
          <div class="info">
            <div class="name">${esc(e.name)}</div>
            <div class="meta">${meta}</div>
            ${rec && rec.reason ? `<div class="reason">${esc(rec.reason)}</div>` : ''}
          </div>
          <span class="pill ${rec ? rec.status : 'none'}">${rec ? esc(st.short) : '—'}</span>
        </article>`;
    }).join('');
  }

  function render() {
    renderDate();
    renderStats();
    renderList();
  }

  /* =========================================================
     Attendance sheet
     ========================================================= */
  function updateStatusUI() {
    $$('.status-btn', statusGrid).forEach(btn => {
      btn.classList.toggle('active', btn.dataset.status === pickedStatus);
    });
    reasonField.classList.toggle('hidden', pickedStatus !== 'absent');
  }

  function openAttendance(id) {
    const emp = db.employees.find(e => e.id === id);
    if (!emp) return;

    activeEmpId = id;
    const rec = getRecord(id);
    pickedStatus = rec ? rec.status : null;

    attName.textContent = emp.name;
    attRole.textContent = emp.role || 'Employee';
    attAvatar.textContent = initials(emp.name);
    const hue = hueOf(emp.name);
    attAvatar.style.background =
      `linear-gradient(135deg, hsl(${hue} 52% 33%), hsl(${(hue + 48) % 360} 48% 20%))`;

    reasonInput.value = (rec && rec.reason) || '';
    timeInput.value = (rec && rec.time) || nowTime();

    updateStatusUI();
    openSheet(attSheet);
  }

  statusGrid.addEventListener('click', (ev) => {
    const btn = ev.target.closest('.status-btn');
    if (!btn) return;
    buzz(6);
    pickedStatus = btn.dataset.status;
    if (pickedStatus !== 'absent') reasonInput.blur();
    updateStatusUI();
  });

  reasonInput.addEventListener('input', () => {
    // nothing fancy — free text
  });

  $$('.chip', reasonField).forEach(chip => {
    chip.addEventListener('click', () => {
      const val = chip.dataset.reason;
      const cur = reasonInput.value.trim();
      reasonInput.value = cur ? (cur.includes(val) ? cur : cur + '; ' + val) : val;
      buzz(5);
    });
  });

  $('#saveAttBtn').addEventListener('click', () => {
    if (!activeEmpId) return;
    if (!pickedStatus) { toast('Select a status first'); buzz(20); return; }

    const rec = {
      status: pickedStatus,
      time: timeInput.value || nowTime()
    };
    if (pickedStatus === 'absent') {
      const r = reasonInput.value.trim();
      if (r) rec.reason = r;
    }

    setRecord(activeEmpId, rec);
    buzz(14);
    closeSheets();
    render();
    toast(`${STATUS[pickedStatus].label} saved · ${formatTime(rec.time)}`);
  });

  $('#clearAttBtn').addEventListener('click', () => {
    if (!activeEmpId) return;
    if (!getRecord(activeEmpId)) { toast('Nothing to clear'); return; }
    setRecord(activeEmpId, null);
    buzz(14);
    closeSheets();
    render();
    toast('Entry cleared');
  });

  $('#editEmpBtn').addEventListener('click', () => {
    const id = activeEmpId;
    closeSheets();
    setTimeout(() => openEmployeeSheet(id), 170);
  });

  /* =========================================================
     Employee sheet
     ========================================================= */
  function disarmDelete() {
    deleteArmed = false;
    clearTimeout(deleteTimer);
    deleteEmpBtn.classList.remove('armed');
    deleteEmpBtn.textContent = 'Delete Employee';
  }

  function openEmployeeSheet(id) {
    editingId = id || null;
    const emp = id ? db.employees.find(e => e.id === id) : null;

    empSheetTitle.textContent = emp ? 'Edit Employee' : 'Add Employee';
    empNameIn.value = emp ? emp.name : '';
    empRoleIn.value = emp ? (emp.role || '') : '';

    deleteEmpBtn.style.display = emp ? 'block' : 'none';
    disarmDelete();

    openSheet(empSheet);
    if (!emp) setTimeout(() => empNameIn.focus(), 380);
  }

  $('#addBtn').addEventListener('click', () => {
    buzz(8);
    openEmployeeSheet(null);
  });

  $('#cancelEmpBtn').addEventListener('click', () => {
    disarmDelete();
    closeSheets();
  });

  $('#saveEmpBtn').addEventListener('click', () => {
    const name = empNameIn.value.trim();
    const role = empRoleIn.value.trim();

    if (!name) { toast('Please enter a name'); empNameIn.focus(); buzz(20); return; }

    // Duplicate check
    const dup = db.employees.some(e =>
      e.name.toLowerCase() === name.toLowerCase() && e.id !== editingId);
    if (dup) { toast('That name already exists'); buzz(20); return; }

    if (editingId) {
      const emp = db.employees.find(e => e.id === editingId);
      if (emp) { emp.name = name; emp.role = role; }
      toast('Employee updated');
    } else {
      db.employees.push({ id: uid(), name, role, createdAt: Date.now() });
      toast('Employee added');
    }

    saveData();
    disarmDelete();
    closeSheets();
    render();
    buzz(12);
  });

  deleteEmpBtn.addEventListener('click', () => {
    if (!editingId) return;

    if (!deleteArmed) {
      deleteArmed = true;
      deleteEmpBtn.classList.add('armed');
      deleteEmpBtn.textContent = 'Tap again to confirm';
      buzz(12);
      deleteTimer = setTimeout(disarmDelete, 3200);
      return;
    }

    const emp = db.employees.find(e => e.id === editingId);
    const name = emp ? emp.name : 'Employee';

    db.employees = db.employees.filter(e => e.id !== editingId);
    Object.keys(db.records).forEach(k => {
      if (db.records[k][editingId]) {
        delete db.records[k][editingId];
        if (!Object.keys(db.records[k]).length) delete db.records[k];
      }
    });

    saveData();
    disarmDelete();
    closeSheets();
    render();
    buzz(24);
    toast(`${name} removed`);
  });

  /* =========================================================
     Card tap → attendance
     ========================================================= */
  listEl.addEventListener('click', (ev) => {
    const card = ev.target.closest('.card');
    if (!card) return;
    buzz(6);
    openAttendance(card.dataset.id);
  });

  /* =========================================================
     Date navigation
     ========================================================= */
  prevDayBtn.addEventListener('click', () => {
    currentDate = shiftDate(currentDate, -1);
    buzz(5);
    render();
  });
  nextDayBtn.addEventListener('click', () => {
    if (currentDate >= dateKey()) return;
    currentDate = shiftDate(currentDate, 1);
    buzz(5);
    render();
  });

  /* =========================================================
     Search
     ========================================================= */
  $('#search').addEventListener('input', (ev) => {
    searchQuery = ev.target.value;
    renderList();
  });

  /* =========================================================
     CSV export
     ========================================================= */
  $('#exportBtn').addEventListener('click', () => {
    if (!db.employees.length) { toast('No employees to export'); return; }

    const day = db.records[currentDate] || {};
    const rows = [['Date', 'Name', 'Position', 'Status', 'Time', 'Reason']];

    db.employees
      .slice()
      .sort((a, b) => a.name.localeCompare(b.name))
      .forEach(e => {
        const r = day[e.id];
        rows.push([
          currentDate,
          e.name,
          e.role || '',
          r ? STATUS[r.status].label : 'Not marked',
          r && r.time ? formatTime(r.time) : '',
          (r && r.reason) || ''
        ]);
      });

    const csv = rows
      .map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','))
      .join('\r\n');

    try {
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `attendance-${currentDate}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1500);
      toast('CSV exported');
      buzz(12);
    } catch (err) {
      toast('Export not supported here');
    }
  });

  /* =========================================================
     Live clock
     ========================================================= */
  function tickClock() {
    const d = new Date();
    let h = d.getHours();
    const ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    clockEl.textContent =
      `${h}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')} ${ap}`;
  }

  /* =========================================================
     Boot
     ========================================================= */
  function init() {
    loadData();
    currentDate = dateKey();
    render();
    tickClock();
    setInterval(tickClock, 1000);

    // Roll the date over automatically at midnight
    let lastKey = dateKey();
    setInterval(() => {
      const k = dateKey();
      if (k !== lastKey) {
        lastKey = k;
        if (currentDate !== k) { currentDate = k; render(); }
      }
    }, 30000);
  }

  init();
})();
</script>
</body>
</html>
