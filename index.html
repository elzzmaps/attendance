<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Attendance</title>
<style>
:root{
  --bg:#0b0f19;
  --surface:#151d2e;
  --surface-2:#1b2437;
  --line:rgba(255,255,255,.07);
  --text:#e8edf7;
  --muted:#8b97ad;
  --accent:#5b8cff;
  --violet:#8b5cf6;
  --green:#22c55e;
  --amber:#f59e0b;
  --red:#ef4444;
  --slate:#94a3b8;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
body::before{
  content:'';
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(620px 420px at 8% -8%, rgba(91,140,255,.20), transparent 62%),
    radial-gradient(560px 420px at 108% 6%, rgba(139,92,246,.16), transparent 62%),
    radial-gradient(700px 500px at 50% 110%, rgba(34,197,94,.07), transparent 60%);
}

/* ---------- Layout ---------- */
.app{
  position:relative;z-index:1;
  max-width:560px;margin:0 auto;
  min-height:100dvh;
}

/* ---------- Topbar ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;
  background:rgba(11,15,25,.72);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  backdrop-filter:blur(20px) saturate(160%);
  border-bottom:1px solid rgba(255,255,255,.05);
}
.brand{display:flex;align-items:center;gap:11px;}
.logo{
  width:40px;height:40px;border-radius:13px;flex-shrink:0;
  display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--violet));
  box-shadow:0 8px 22px rgba(91,140,255,.35);
}
.topbar h1{
  margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em;
}
.clock{
  font-size:11.5px;color:var(--muted);font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:.02em;
  display:flex;align-items:center;gap:6px;margin-top:1px;
}
.clock .dot{
  width:6px;height:6px;border-radius:50%;background:var(--green);
  box-shadow:0 0 0 0 rgba(34,197,94,.6);
  animation:pulse 2s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(34,197,94,.55);}
  70%{box-shadow:0 0 0 8px rgba(34,197,94,0);}
  100%{box-shadow:0 0 0 0 rgba(34,197,94,0);}
}
.icon-btn{
  width:40px;height:40px;flex-shrink:0;
  display:grid;place-items:center;
  border-radius:13px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);color:#c4d0e4;
  cursor:pointer;transition:.18s;
}
.icon-btn:active{transform:scale(.92);background:rgba(255,255,255,.09);}

/* ---------- Content ---------- */
.content{padding:14px 16px calc(140px + env(safe-area-inset-bottom));}

/* ---------- Date bar ---------- */
.datebar{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.035);
  border:1px solid var(--line);
  border-radius:17px;padding:6px;
  margin-bottom:12px;
}
.datebar .nav{
  width:42px;height:42px;flex-shrink:0;
  display:grid;place-items:center;
  border-radius:13px;border:none;
  background:rgba(255,255,255,.05);color:#cfd9ea;
  font-size:20px;line-height:1;cursor:pointer;transition:.18s;
  font-family:inherit;
}
.datebar .nav:active{transform:scale(.9);background:rgba(255,255,255,.1);}
.datebar .nav:disabled{opacity:.25;pointer-events:none;}
.date-display{flex:1;text-align:center;min-width:0;}
.date-display strong{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.01em;}
.date-display span{display:block;font-size:11px;color:var(--muted);margin-top:1px;font-weight:500;}

/* ---------- Stats (5 columns) ---------- */
.stats{
  display:grid;grid-template-columns:repeat(5,1fr);gap:6px;
  margin-bottom:14px;
}
.stat{
  background:rgba(255,255,255,.035);
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px 2px 8px;
  text-align:center;
  min-width:0;
}
.stat b{display:block;font-size:17px;font-weight:800;letter-spacing:-.04em;line-height:1;}
.stat span{
  display:block;margin-top:4px;
  font-size:8px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;font-weight:800;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.stat.present b{color:#4ade80;}
.stat.half b{color:#fbbf24;}
.stat.absent b{color:#f87171;}
.stat.nowork b{color:var(--slate);}
.stat.unmarked b{color:#94a3b8;}

/* ---------- Search ---------- */
.search{position:relative;margin-bottom:14px;}
.search svg{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  color:#64748b;pointer-events:none;
}
.search input{
  width:100%;
  padding:13px 14px 13px 41px;
  border-radius:15px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--line);
  color:var(--text);font-size:15px;font-family:inherit;
  outline:none;transition:.2s;
}
.search input::placeholder{color:#5c6a80;}
.search input:focus{
  border-color:rgba(91,140,255,.55);
  background:rgba(91,140,255,.06);
  box-shadow:0 0 0 4px rgba(91,140,255,.09);
}

/* ---------- Cards ---------- */
.card{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;
  margin-bottom:9px;
  border-radius:18px;
  background:linear-gradient(180deg,#161f31,#121a28);
  border:1px solid var(--line);
  cursor:pointer;
  transition:transform .14s ease, border-color .2s, background .2s;
  animation:rise .32s cubic-bezier(.22,1,.36,1) both;
}
@keyframes rise{
  from{opacity:0;transform:translateY(9px);}
  to{opacity:1;transform:translateY(0);}
}
.card:active{transform:scale(.978);border-color:rgba(255,255,255,.14);}
.avatar{
  width:45px;height:45px;flex-shrink:0;
  border-radius:15px;
  display:grid;place-items:center;
  font-weight:800;font-size:15px;letter-spacing:.02em;
  color:#dbe6fb;
  border:1px solid rgba(255,255,255,.07);
}
.card .info{flex:1;min-width:0;}
.card .name{
  font-size:15px;font-weight:650;letter-spacing:-.01em;
  display:flex;align-items:center;gap:6px;min-width:0;
}
.card .name .name-text{
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-transform:uppercase;
  letter-spacing:.02em;
}
.card .name .hist-ico{
  flex-shrink:0;color:#5b8cff;opacity:.7;
}
.card .meta{
  font-size:11.5px;color:var(--muted);margin-top:2.5px;font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-variant-numeric:tabular-nums;
}
.card .reason{
  font-size:11px;color:#f0a3a3;margin-top:3px;font-style:italic;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.card .reason.slate{color:#cbd5e1;}
.pill{
  flex-shrink:0;
  font-size:10.5px;font-weight:800;
  padding:6px 10px;border-radius:999px;
  letter-spacing:.02em;white-space:nowrap;
}
.pill.present{background:rgba(34,197,94,.15);color:#4ade80;}
.pill.half{background:rgba(245,158,11,.15);color:#fbbf24;}
.pill.absent{background:rgba(239,68,68,.15);color:#f87171;}
.pill.nowork{background:rgba(148,163,184,.15);color:#cbd5e1;}
.pill.none{background:rgba(255,255,255,.05);color:#5f6d82;}

/* ---------- Empty ---------- */
.empty{
  text-align:center;padding:52px 24px;
  animation:rise .35s ease both;
}
.empty-icon{font-size:38px;margin-bottom:12px;opacity:.85;}
.empty h3{margin:0 0 6px;font-size:16px;font-weight:700;}
.empty p{margin:0;font-size:13px;color:var(--muted);line-height:1.5;}

/* ---------- FAB ---------- */
.fab{
  position:fixed;
  right:max(18px, calc(50% - 280px + 18px));
  bottom:calc(24px + env(safe-area-inset-bottom));
  width:60px;height:60px;z-index:30;
  border-radius:20px;border:none;
  background:linear-gradient(135deg,var(--accent),var(--violet));
  color:#fff;font-size:30px;font-weight:300;line-height:1;
  display:grid;place-items:center;padding-bottom:3px;
  box-shadow:0 14px 32px rgba(91,140,255,.42), 0 2px 8px rgba(0,0,0,.4);
  cursor:pointer;transition:transform .18s cubic-bezier(.34,1.56,.64,1);
}
.fab:active{transform:scale(.9);}

/* ---------- Overlay & Sheets ---------- */
.overlay{
  position:fixed;inset:0;z-index:50;
  background:rgba(3,6,12,.68);
  -webkit-backdrop-filter:blur(3px);
  backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .28s;
}
.overlay.open{opacity:1;pointer-events:auto;}

.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  max-width:560px;margin:0 auto;
  max-height:92dvh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  background:linear-gradient(180deg,#182135,#131b2a);
  border-radius:28px 28px 0 0;
  border-top:1px solid rgba(255,255,255,.09);
  padding:10px 20px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(105%);
  transition:transform .38s cubic-bezier(.32,.72,0,1);
  box-shadow:0 -20px 60px rgba(0,0,0,.55);
}
.sheet.open{transform:translateY(0);}
.handle{
  width:38px;height:4px;border-radius:99px;
  background:rgba(255,255,255,.18);
  margin:0 auto 16px;
}

.sheet-head{display:flex;align-items:center;gap:13px;margin-bottom:4px;}
.sheet-head .avatar{width:52px;height:52px;border-radius:17px;font-size:17px;}
.sheet-head .who{flex:1;min-width:0;}
.sheet-head h2{
  margin:0;font-size:17.5px;font-weight:700;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-transform:uppercase;
  letter-spacing:.02em;
}
.sheet-head p{margin:3px 0 0;font-size:12.5px;color:var(--muted);font-weight:500;}
.pencil{
  width:38px;height:38px;flex-shrink:0;
  display:grid;place-items:center;border-radius:12px;
  border:1px solid var(--line);background:rgba(255,255,255,.04);
  color:#a9b6cc;cursor:pointer;transition:.18s;
}
.pencil:active{transform:scale(.9);background:rgba(255,255,255,.1);}

.sheet-title{
  margin:0 0 16px;font-size:17px;font-weight:750;letter-spacing:-.02em;
}

/* ---------- Status picker (2x2 grid) ---------- */
.status-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:9px;
  margin:18px 0 4px;
}
.status-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 10px;border-radius:17px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.03);
  color:#98a5ba;font-size:12.5px;font-weight:700;
  font-family:inherit;cursor:pointer;
  transition:.2s;
}
.status-btn .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.status-btn[data-status="present"] .dot{background:var(--green);}
.status-btn[data-status="half"] .dot{background:var(--amber);}
.status-btn[data-status="absent"] .dot{background:var(--red);}
.status-btn[data-status="nowork"] .dot{background:var(--slate);}
.status-btn:active{transform:scale(.96);}
.status-btn.active[data-status="present"]{
  background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.5);color:#4ade80;
  box-shadow:0 0 0 3px rgba(34,197,94,.08);
}
.status-btn.active[data-status="half"]{
  background:rgba(245,158,11,.14);border-color:rgba(245,158,11,.5);color:#fbbf24;
  box-shadow:0 0 0 3px rgba(245,158,11,.08);
}
.status-btn.active[data-status="absent"]{
  background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.5);color:#f87171;
  box-shadow:0 0 0 3px rgba(239,68,68,.08);
}
.status-btn.active[data-status="nowork"]{
  background:rgba(148,163,184,.15);border-color:rgba(148,163,184,.5);color:#cbd5e1;
  box-shadow:0 0 0 3px rgba(148,163,184,.08);
}

/* ---------- Fields ---------- */
.field{margin-top:16px;animation:fadeUp .28s ease both;}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(7px);}
  to{opacity:1;transform:translateY(0);}
}
.field label{
  display:block;font-size:11px;font-weight:800;
  text-transform:uppercase;letter-spacing:.08em;
  color:var(--muted);margin-bottom:8px;
}
.field textarea,
.field input{
  width:100%;
  padding:13px 14px;
  border-radius:15px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--line);
  color:var(--text);font-size:15px;font-family:inherit;
  outline:none;transition:.2s;
  resize:none;
}
.field textarea{min-height:78px;line-height:1.45;}
.field input:focus,.field textarea:focus{
  border-color:rgba(91,140,255,.55);
  background:rgba(91,140,255,.06);
  box-shadow:0 0 0 4px rgba(91,140,255,.09);
}
.field input::placeholder,.field textarea::placeholder{color:#5c6a80;}

/* Auto-capslock name inputs */
#empName, #attName, #histName{text-transform:uppercase;letter-spacing:.02em;}

.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px;}
.chip{
  padding:7px 12px;border-radius:999px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.04);
  color:#9aa8bd;font-size:12px;font-weight:600;
  font-family:inherit;cursor:pointer;transition:.18s;
}
.chip:active{transform:scale(.94);background:rgba(91,140,255,.16);color:#9ec0ff;}

/* ---------- Actions ---------- */
.actions{
  display:flex;gap:10px;margin-top:24px;
}
.btn{
  flex:1;
  padding:15px 16px;
  border-radius:16px;border:none;
  font-size:14.5px;font-weight:750;
  font-family:inherit;cursor:pointer;
  transition:transform .15s, opacity .2s, background .2s;
}
.btn:active{transform:scale(.97);}
.btn.primary{
  background:linear-gradient(135deg,var(--accent),var(--violet));
  color:#fff;
  box-shadow:0 10px 26px rgba(91,140,255,.32);
}
.btn.ghost{
  background:rgba(255,255,255,.05);
  border:1px solid var(--line);
  color:#a9b6cc;
  flex:0 0 auto;
  padding-left:22px;padding-right:22px;
}
.btn.danger{
  background:rgba(239,68,68,.12);
  border:1px solid rgba(239,68,68,.34);
  color:#f87171;
}
.btn.danger.armed{
  background:var(--red);
  border-color:var(--red);
  color:#fff;
  animation:shake .35s;
}
@keyframes shake{
  0%,100%{transform:translateX(0);}
  25%{transform:translateX(-5px);}
  75%{transform:translateX(5px);}
}
.btn-row{display:flex;gap:10px;margin-top:12px;}

/* ---------- History: segmented range ---------- */
.segment{
  display:flex;gap:6px;padding:5px;border-radius:15px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--line);
  margin:18px 0 14px;
}
.segment button{
  flex:1;padding:9px 4px;
  border:none;border-radius:11px;
  background:transparent;color:#8b97ad;
  font-size:12px;font-weight:700;font-family:inherit;
  cursor:pointer;transition:.2s;white-space:nowrap;
}
.segment button.active{
  background:rgba(91,140,255,.18);
  color:#9ec0ff;
  box-shadow:inset 0 0 0 1px rgba(91,140,255,.32);
}
.segment button:active{transform:scale(.95);}

/* ---------- History: tally grid (5 cols) ---------- */
.tally-grid{
  display:grid;grid-template-columns:repeat(5,1fr);gap:6px;
}
.tally{
  background:rgba(255,255,255,.035);
  border:1px solid var(--line);
  border-radius:14px;
  padding:11px 2px 9px;
  text-align:center;
  min-width:0;
}
.tally b{
  display:block;font-size:18px;font-weight:800;
  letter-spacing:-.04em;line-height:1;
}
.tally span{
  display:block;margin-top:4px;
  font-size:8px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.05em;font-weight:800;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tally.present b{color:#4ade80;}
.tally.half b{color:#fbbf24;}
.tally.absent b{color:#f87171;}
.tally.nowork b{color:var(--slate);}
.tally.total b{color:#9ec0ff;}

/* ---------- History: rate card ---------- */
.rate-card{
  margin-top:12px;padding:15px 15px 14px;
  border-radius:17px;
  background:rgba(255,255,255,.035);
  border:1px solid var(--line);
}
.rate-top{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:11px;
}
.rate-top span{
  font-size:10.5px;color:var(--muted);font-weight:800;
  text-transform:uppercase;letter-spacing:.08em;
}
.rate-top strong{
  font-size:22px;font-weight:800;letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;
}
.rate-bar{
  height:9px;border-radius:99px;overflow:hidden;
  background:rgba(255,255,255,.07);
  display:flex;
}
.rate-bar i{
  display:block;height:100%;width:0;
  transition:width .45s cubic-bezier(.22,1,.36,1);
}
.rate-legend{
  display:flex;flex-wrap:wrap;gap:12px;margin-top:11px;
  font-size:11px;color:var(--muted);font-weight:600;
}
.rate-legend span{display:flex;align-items:center;gap:5px;}
.rate-legend i{
  width:8px;height:8px;border-radius:50%;display:block;
}

/* ---------- History: list ---------- */
.hist-list{margin-top:16px;}
.hist-section{
  font-size:10.5px;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);
  margin:0 0 10px 3px;
}
.hist-row{
  display:flex;align-items:center;gap:11px;
  padding:11px 13px;margin-bottom:8px;
  border-radius:15px;
  background:rgba(255,255,255,.03);
  border:1px solid var(--line);
  animation:rise .3s ease both;
}
.hist-badge{
  width:38px;height:38px;flex-shrink:0;
  border-radius:12px;
  display:grid;place-items:center;
  font-size:10px;font-weight:800;line-height:1.1;
  text-align:center;letter-spacing:.02em;
  border:1px solid rgba(255,255,255,.06);
}
.hist-badge small{display:block;font-size:8.5px;font-weight:700;opacity:.7;}
.hist-body{flex:1;min-width:0;}
.hist-body strong{
  display:block;font-size:13.5px;font-weight:650;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.hist-body span{
  display:block;font-size:11px;color:var(--muted);margin-top:2.5px;
  font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.hist-body .why{color:#f0a3a3;font-style:italic;}
.hist-body .why.slate{color:#cbd5e1;}
.hist-row .pill{font-size:10px;padding:5px 9px;}

/* ---------- Hide ---------- */
.hidden{display:none !important;}

/* ---------- Toast ---------- */
.toast{
  position:fixed;left:50%;
  bottom:calc(104px + env(safe-area-inset-bottom));
  transform:translate(-50%,16px);
  opacity:0;pointer-events:none;z-index:120;
  background:rgba(30,42,62,.96);
  -webkit-backdrop-filter:blur(14px);
  backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.1);
  color:#e8edf7;
  padding:12px 20px;border-radius:15px;
  font-size:13px;font-weight:650;white-space:nowrap;
  box-shadow:0 14px 36px rgba(0,0,0,.5);
  transition:all .3s cubic-bezier(.22,1,.36,1);
  max-width:88vw;overflow:hidden;text-overflow:ellipsis;
}
.toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6L9 17l-5-5"/>
        </svg>
      </div>
      <div>
        <h1>Attendance</h1>
        <div class="clock"><span class="dot"></span><span id="clock">--:--:--</span></div>
      </div>
    </div>
    <button class="icon-btn" id="exportBtn" aria-label="Export CSV">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
        <path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>

    </button>
  </header>

  <div class="content">

    <!-- Date navigator -->

      <div class="date-display">

    </div>

    <!-- Stats -->

      <div class="stat present"><b id="cPresent">0</b><span>Present</span></div>
      <div class="stat half"><b id="cHalf">0</b><span>Half</span></div>
      <div class="stat absent"><b id="cAbsent">0</b><span>Absent</span></div>
      <div class="stat nowork"><b id="cNoWork">0</b><span>No Work</span></div>

    <!-- Search -->

      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

      </svg>
      <input id="search" type="search" placeholder="Search employees…" autocomplete="off">
    </div>

    <!-- Employee list -->
    <div id="list"></div>

  </div>

  <button class="fab" id="addBtn" aria-label="Add employee">+</button>
</div>

<!-- Overlay -->
<div class="overlay" id="overlay"></div>

<!-- ============ ATTENDANCE SHEET ============ -->
<div class="sheet" id="attSheet">
  <div class="handle"></div>

  <div class="sheet-head">

      <button class="chip" data-nowork="Company event">Company event</button>

<div class="sheet" id="historySheet">

  <div class="tally-grid">

    </div>
    <div class="rate-legend">
      <span><i style="background:#4ade80"></i>Present</span>
      <span><i style="background:#fbbf24"></i>Half</span>
      <span><i style="background:#f87171"></i>Absent</span>
      <span><i style="background:#94a3b8"></i>No Work</span>
    </div>
    <p style="margin:10px 0 0;font-size:10.5px;color:#8b97ad;line-height:1.4">
      Rate excludes <strong style="color:#cbd5e1">No Work</strong> days from the denominator.
    </p>
  </div>

  <div class="hist-list" id="histList"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  /* =========================================================
     Utilities
     ========================================================= */
  const $  = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));

  const buzz = (ms = 8) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

  const STATUS = {
    present: { label: 'Present',  short: 'Present'  },
    half:    { label: 'Half Day', short: 'Half Day' },
    absent:  { label: 'Absent',   short: 'Absent'   },
    nowork:  { label: 'No Work',  short: 'No Work'  }
  };

  /* ---- Date helpers ---- */
  function dateKey(d = new Date()) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }
  function parseKey(k) {
    const [y, m, d] = k.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  function shiftDate(k, delta) {
    const d = parseKey(k);
    d.setDate(d.getDate() + delta);
    return dateKey(d);
  }
  function nowTime() {
    const d = new Date();
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  function formatTime(t) {
    if (!t) return '';
    const [h, m] = t.split(':').map(Number);
    const ap = h >= 12 ? 'PM' : 'AM';
    const hh = h % 12 || 12;
    return `${hh}:${String(m).padStart(2, '0')} ${ap}`;
  }

  function initials(name) {
    const parts = String(name).trim().split(/\s+/).filter(Boolean).slice(0, 2);
    if (!parts.length) return '?';
    return parts.map(p => p[0]).join('').toUpperCase();
  }
  function hueOf(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360;
    return h;
  }
  function avatarBg(name) {
    const hue = hueOf(name);
    return `linear-gradient(135deg, hsl(${hue} 52% 33%), hsl(${(hue + 48) % 360} 48% 20%))`;
  }

  /* =========================================================
     Data layer
     ========================================================= */
  const STORE_KEY = 'attendanceApp.v1';
  let db = { employees: [], records: {} };

  function loadData() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object') {
          db.employees = Array.isArray(parsed.employees) ? parsed.employees : [];
          db.records   = parsed.records && typeof parsed.records === 'object' ? parsed.records : {};
        }
      }
    } catch (e) {
      console.warn('Could not read saved data', e);
    }
  }
  function saveData() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(db));
    } catch (e) {
      toast('Storage full — could not save');
    }
  }

  function getRecord(empId, dateK = currentDate) {
    const day = db.records[dateK];
    return (day && day[empId]) || null;
  }
  function setRecord(empId, rec, dateK = currentDate) {
    if (!db.records[dateK]) db.records[dateK] = {};
    if (rec) db.records[dateK][empId] = rec;
    else delete db.records[dateK][empId];
    if (!Object.keys(db.records[dateK]).length) delete db.records[dateK];
    saveData();
  }

  /* =========================================================
     App state
     ========================================================= */
  let currentDate   = dateKey();
  let searchQuery   = '';
  let activeEmpId   = null;
  let editingId     = null;
  let pickedStatus  = null;
  let deleteArmed   = false;
  let deleteTimer   = null;
  let historyEmpId  = null;
  let historyRange  = 'all';

  /* =========================================================
     DOM refs
     ========================================================= */
  const listEl      = $('#list');
  const overlay     = $('#overlay');
  const attSheet    = $('#attSheet');
  const empSheet    = $('#empSheet');
  const historySheet= $('#historySheet');
  const toastEl     = $('#toast');

  const clockEl     = $('#clock');
  const dateLabel   = $('#dateLabel');
  const dateSub     = $('#dateSub');
  const prevDayBtn  = $('#prevDay');
  const nextDayBtn  = $('#nextDay');

  const attAvatar   = $('#attAvatar');
  const attName     = $('#attName');
  const attRole     = $('#attRole');
  const statusGrid  = $('#statusGrid');
  const reasonField = $('#reasonField');
  const reasonInput = $('#reasonInput');
  const noworkField = $('#noworkField');
  const noworkInput = $('#noworkInput');
  const timeField   = $('#timeField');
  const timeInput   = $('#timeInput');

  const empSheetTitle = $('#empSheetTitle');
  const empNameIn     = $('#empName');
  const empRoleIn     = $('#empRole');
  const deleteEmpBtn  = $('#deleteEmpBtn');

  const histAvatar  = $('#histAvatar');
  const histName    = $('#histName');
  const histRole    = $('#histRole');
  const histSegment = $('#histSegment');
  const histList    = $('#histList');

  /* =========================================================
     Toast
     ========================================================= */
  let toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2100);
  }

  /* =========================================================
     Sheet management
     ========================================================= */
  function openSheet(el) {
    overlay.classList.add('open');
    el.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeSheets() {
    overlay.classList.remove('open');
    [attSheet, empSheet, historySheet].forEach(s => s.classList.remove('open'));
    document.body.style.overflow = '';
  }
  overlay.addEventListener('click', closeSheets);

  /* =========================================================
     Rendering — main screen
     ========================================================= */
  function renderDate() {
    const today = dateKey();
    const d = parseKey(currentDate);
    const isToday = currentDate === today;
    const isYesterday = currentDate === shiftDate(today, -1);

    if (isToday) dateLabel.textContent = 'Today';
    else if (isYesterday) dateLabel.textContent = 'Yesterday';
    else dateLabel.textContent = d.toLocaleDateString(undefined, { weekday: 'long' });

    dateSub.textContent = d.toLocaleDateString(undefined, {
      month: 'long', day: 'numeric', year: 'numeric'
    });

    nextDayBtn.disabled = currentDate >= today;
  }

  function renderStats() {
    const day = db.records[currentDate] || {};
    let p = 0, h = 0, a = 0, n = 0;
    db.employees.forEach(e => {
      const r = day[e.id];
      if (!r) return;
      if (r.status === 'present') p++;
      else if (r.status === 'half') h++;
      else if (r.status === 'absent') a++;
      else if (r.status === 'nowork') n++;
    });
    const un = Math.max(0, db.employees.length - p - h - a - n);
    $('#cPresent').textContent  = p;
    $('#cHalf').textContent     = h;
    $('#cAbsent').textContent   = a;
    $('#cNoWork').textContent   = n;
    $('#cUnmarked').textContent = un;
  }

  function renderList() {
    if (!db.employees.length) {
      listEl.innerHTML = `
        <div class="empty">
          <div class="empty-icon">👥</div>
          <h3>No employees yet</h3>
          <p>Tap the <strong>+</strong> button to add your first team member and start logging attendance.</p>
        </div>`;
      return;
    }

    const q = searchQuery.trim().toLowerCase();
    const emps = db.employees
      .filter(e => !q ||
        e.name.toLowerCase().includes(q) ||
        (e.role || '').toLowerCase().includes(q))
      .sort((a, b) => a.name.localeCompare(b.name));

    if (!emps.length) {
      listEl.innerHTML = `
        <div class="empty">
          <div class="empty-icon">🔍</div>
          <h3>No matches</h3>
          <p>No employee matches “${esc(searchQuery)}”.</p>
        </div>`;
      return;
    }

    const day = db.records[currentDate] || {};

    listEl.innerHTML = emps.map((e, i) => {
      const rec = day[e.id];
      const st  = rec ? STATUS[rec.status] : null;

      const parts = [];
      if (e.role) parts.push(esc(e.role));
      if (rec && rec.time && rec.status !== 'nowork') parts.push(esc(formatTime(rec.time)));

      let meta;
      if (parts.length) meta = parts.join(' · ');
      else if (rec && rec.status === 'nowork') meta = 'No work day';
      else meta = 'Not marked';

      const reasonClass = rec && rec.status === 'nowork' ? 'reason slate' : 'reason';

      return `
        <article class="card" data-id="${e.id}" style="animation-delay:${Math.min(i * 26, 220)}ms">
          <div class="avatar" style="background:${avatarBg(e.name)}">
            ${esc(initials(e.name))}
          </div>
          <div class="info">
            <div class="name">
              <span class="name-text">${esc(e.name)}</span>
              <svg class="hist-ico" width="13" height="13" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="12" width="3.4" height="8" rx="1.2"/>
                <rect x="10.3" y="7" width="3.4" height="13" rx="1.2"/>
                <rect x="16.6" y="3" width="3.4" height="17" rx="1.2"/>
              </svg>
            </div>
            <div class="meta">${meta}</div>
            ${rec && rec.reason ? `<div class="${reasonClass}">${esc(rec.reason)}</div>` : ''}
          </div>
          <span class="pill ${rec ? rec.status : 'none'}">${rec ? esc(st.short) : '—'}</span>
        </article>`;
    }).join('');
  }

  function render() {
    renderDate();
    renderStats();
    renderList();
  }

  /* =========================================================
     Attendance sheet
     ========================================================= */
  function updateStatusUI() {
    $$('.status-btn', statusGrid).forEach(btn => {
      btn.classList.toggle('active', btn.dataset.status === pickedStatus);
    });
    reasonField.classList.toggle('hidden', pickedStatus !== 'absent');
    noworkField.classList.toggle('hidden', pickedStatus !== 'nowork');
    // Hide timestamp for No Work — the day isn't worked, so no time is meaningful.
    timeField.classList.toggle('hidden', pickedStatus === 'nowork');
  }

  function openAttendance(id) {
    const emp = db.employees.find(e => e.id === id);
    if (!emp) return;

    activeEmpId = id;
    const rec = getRecord(id);
    pickedStatus = rec ? rec.status : null;

    attName.textContent = emp.name;
    attRole.textContent = emp.role || 'Employee';
    attAvatar.textContent = initials(emp.name);
    attAvatar.style.background = avatarBg(emp.name);

    /* Both note textareas are populated from the same record.reason so the
       correct one shows the note if the user switches status. */
    reasonInput.value = (rec && rec.reason) || '';
    noworkInput.value = (rec && rec.reason) || '';
    timeInput.value = (rec && rec.time) || nowTime();

    updateStatusUI();
    openSheet(attSheet);
  }

  statusGrid.addEventListener('click', (ev) => {
    const btn = ev.target.closest('.status-btn');
    if (!btn) return;
    buzz(6);
    pickedStatus = btn.dataset.status;
    if (pickedStatus !== 'absent') reasonInput.blur();
    if (pickedStatus !== 'nowork') noworkInput.blur();
    updateStatusUI();
  });

  /* Absent chips */
  $$('.chip', reasonField).forEach(chip => {
    chip.addEventListener('click', () => {
      const val = chip.dataset.reason;
      const cur = reasonInput.value.trim();
      reasonInput.value = cur ? (cur.includes(val) ? cur : cur + '; ' + val) : val;
      buzz(5);
    });
  });

  /* No Work chips */
  $$('.chip', noworkField).forEach(chip => {
    chip.addEventListener('click', () => {
      const val = chip.dataset.nowork;
      const cur = noworkInput.value.trim();
      noworkInput.value = cur ? (cur.includes(val) ? cur : cur + '; ' + val) : val;
      buzz(5);
    });
  });

  $('#saveAttBtn').addEventListener('click', () => {
    if (!activeEmpId) return;
    if (!pickedStatus) { toast('Select a status first'); buzz(20); return; }

    const rec = { status: pickedStatus };

    if (pickedStatus !== 'nowork') {
      rec.time = timeInput.value || nowTime();
    }
    if (pickedStatus === 'absent') {
      const r = reasonInput.value.trim();
      if (r) rec.reason = r;
    } else if (pickedStatus === 'nowork') {
      const r = noworkInput.value.trim();
      if (r) rec.reason = r;
    }

    setRecord(activeEmpId, rec);
    buzz(14);
    closeSheets();
    render();
    toast(`${STATUS[pickedStatus].label} saved` + (rec.time ? ` · ${formatTime(rec.time)}` : ''));
  });

  $('#clearAttBtn').addEventListener('click', () => {
    if (!activeEmpId) return;
    if (!getRecord(activeEmpId)) { toast('Nothing to clear'); return; }
    setRecord(activeEmpId, null);
    buzz(14);
    closeSheets();
    render();
    toast('Entry cleared');
  });

  $('#editEmpBtn').addEventListener('click', () => {
    const id = activeEmpId;
    closeSheets();
    setTimeout(() => openEmployeeSheet(id), 170);
  });

  /* =========================================================
     Employee sheet
     ========================================================= */
  function disarmDelete() {
    deleteArmed = false;
    clearTimeout(deleteTimer);
    deleteEmpBtn.classList.remove('armed');
    deleteEmpBtn.textContent = 'Delete Employee';
  }

  function openEmployeeSheet(id) {
    editingId = id || null;
    const emp = id ? db.employees.find(e => e.id === id) : null;

    empSheetTitle.textContent = emp ? 'Edit Employee' : 'Add Employee';
    empNameIn.value = emp ? emp.name : '';
    empRoleIn.value = emp ? (emp.role || '') : '';

    deleteEmpBtn.style.display = emp ? 'block' : 'none';
    disarmDelete();

    openSheet(empSheet);
    if (!emp) setTimeout(() => empNameIn.focus(), 380);
  }

  /* Live uppercasing for the name input (keeps cursor position stable) */
  empNameIn.addEventListener('input', () => {
    const el = empNameIn;
    const start = el.selectionStart;
    const end = el.selectionEnd;
    const upper = el.value.toUpperCase();
    if (upper !== el.value) {
      el.value = upper;
      try { el.setSelectionRange(start, end); } catch (e) {}
    }
  });

  $('#addBtn').addEventListener('click', () => {
    buzz(8);
    openEmployeeSheet(null);
  });

  $('#cancelEmpBtn').addEventListener('click', () => {
    disarmDelete();
    closeSheets();
  });

  $('#saveEmpBtn').addEventListener('click', () => {
    const name = empNameIn.value.trim().toUpperCase();
    const role = empRoleIn.value.trim();

    if (!name) { toast('Please enter a name'); empNameIn.focus(); buzz(20); return; }

    const dup = db.employees.some(e =>
      e.name.toLowerCase() === name.toLowerCase() && e.id !== editingId);
    if (dup) { toast('That name already exists'); buzz(20); return; }

    if (editingId) {
      const emp = db.employees.find(e => e.id === editingId);
      if (emp) { emp.name = name; emp.role = role; }
      toast('Employee updated');
    } else {
      db.employees.push({ id: uid(), name, role, createdAt: Date.now() });
      toast('Employee added');
    }

    saveData();
    disarmDelete();
    closeSheets();
    render();
    buzz(12);
  });

  deleteEmpBtn.addEventListener('click', () => {
    if (!editingId) return;

    if (!deleteArmed) {
      deleteArmed = true;
      deleteEmpBtn.classList.add('armed');
      deleteEmpBtn.textContent = 'Tap again to confirm';
      buzz(12);
      deleteTimer = setTimeout(disarmDelete, 3200);
      return;
    }

    const emp = db.employees.find(e => e.id === editingId);
    const name = emp ? emp.name : 'Employee';

    db.employees = db.employees.filter(e => e.id !== editingId);
    Object.keys(db.records).forEach(k => {
      if (db.records[k][editingId]) {
        delete db.records[k][editingId];
        if (!Object.keys(db.records[k]).length) delete db.records[k];
      }
    });

    saveData();
    disarmDelete();
    closeSheets();
    render();
    buzz(24);
    toast(`${name} removed`);
  });

  /* =========================================================
     HISTORY / TALLY
     ========================================================= */
  function getHistory(empId, range) {
    const ref = parseKey(currentDate);
    const out = [];

    Object.keys(db.records).forEach(dk => {
      const day = db.records[dk];
      if (!day || !day[empId]) return;

      const d = parseKey(dk);
      if (range === 'month') {
        if (d.getFullYear() !== ref.getFullYear() || d.getMonth() !== ref.getMonth()) return;
      } else if (range === '30') {
        const diff = Math.round((ref - d) / 86400000);
        if (diff < 0 || diff > 29) return;
      }

      out.push({ date: dk, ...day[empId] });
    });

    out.sort((a, b) => (a.date < b.date ? 1 : -1)); // newest first
    return out;
  }

  function dateLabelFor(dk) {
    const today = dateKey();
    if (dk === today) return 'Today';
    if (dk === shiftDate(today, -1)) return 'Yesterday';
    return parseKey(dk).toLocaleDateString(undefined, {
      weekday: 'short', month: 'short', day: 'numeric'
    });
  }

  function renderHistory() {
    const emp = db.employees.find(e => e.id === historyEmpId);
    if (!emp) { closeSheets(); return; }

    const recs = getHistory(historyEmpId, historyRange);

    const c = { present: 0, half: 0, absent: 0, nowork: 0 };
    recs.forEach(r => { if (c[r.status] !== undefined) c[r.status]++; });
    const total = recs.length;

    $('#tPresent').textContent = c.present;
    $('#tHalf').textContent    = c.half;
    $('#tAbsent').textContent  = c.absent;
    $('#tNoWork').textContent  = c.nowork;
    $('#tTotal').textContent   = total;

    /* Attendance rate: Present = 1, Half Day = 0.5.
       No Work days are excluded from the denominator (they aren't workdays). */
    const workDays = c.present + c.half + c.absent;
    const rate = workDays ? (c.present + c.half * 0.5) / workDays : 0;
    $('#rateValue').textContent = workDays ? Math.round(rate * 100) + '%' : '—';

    /* Bar shows how all logged entries break down (including No Work). */
    const pct = (n) => total ? (n / total) * 100 : 0;
    $('#barPresent').style.width = pct(c.present) + '%';
    $('#barHalf').style.width    = pct(c.half) + '%';
    $('#barAbsent').style.width  = pct(c.absent) + '%';
    $('#barNoWork').style.width  = pct(c.nowork) + '%';

    /* Timeline list */
    if (!total) {
      histList.innerHTML = `
        <div class="empty" style="padding:36px 12px 12px">
          <div class="empty-icon">📅</div>
          <h3>No records</h3>
          <p>No attendance logged for this period.</p>
        </div>`;
      return;
    }

    const shown = recs.slice(0, 120);

    histList.innerHTML = `
      <p class="hist-section">Timeline · ${total} entr${total === 1 ? 'y' : 'ies'}</p>
      ${shown.map((r, i) => {
        const d = parseKey(r.date);
        const dayNum = d.getDate();
        const mon = d.toLocaleDateString(undefined, { month: 'short' });

        const bits = [];
        if (r.time && r.status !== 'nowork') bits.push(formatTime(r.time));

        /* Reason styling differs for No Work (neutral slate) vs Absent (red) */
        const whyClass = r.status === 'nowork' ? 'why slate' : 'why';
        const reasonHtml = r.reason
          ? `<span class="${whyClass}">${esc(r.reason)}</span>`
          : '';

        const sub = bits.length
          ? esc(bits.join(' · '))
          : (r.status === 'nowork' ? 'No work scheduled' : 'No time recorded');

        return `
          <div class="hist-row" style="animation-delay:${Math.min(i * 20, 220)}ms">
            <div class="hist-badge" style="background:${avatarBg(r.date)}">
              <span>${dayNum}<small>${esc(mon)}</small></span>
            </div>
            <div class="hist-body">
              <strong>${esc(dateLabelFor(r.date))}</strong>
              <span>${sub}</span>
              ${reasonHtml}
            </div>
            <span class="pill ${r.status}">${esc(STATUS[r.status].short)}</span>
          </div>`;
      }).join('')}
      ${recs.length > shown.length
        ? `<p class="hist-section" style="text-align:center;margin-top:12px">
             Showing latest ${shown.length} of ${recs.length}
           </p>`
        : ''}
    `;
  }

  function openHistory(id) {
    const emp = db.employees.find(e => e.id === id);
    if (!emp) return;

    historyEmpId = id;
    histName.textContent = emp.name;
    histRole.textContent = emp.role || 'Employee';
    histAvatar.textContent = initials(emp.name);
    histAvatar.style.background = avatarBg(emp.name);

    $$('button', histSegment).forEach(b =>
      b.classList.toggle('active', b.dataset.range === historyRange));

    renderHistory();
    openSheet(historySheet);
  }

  histSegment.addEventListener('click', (ev) => {
    const btn = ev.target.closest('button');
    if (!btn) return;
    historyRange = btn.dataset.range;
    $$('button', histSegment).forEach(b => b.classList.toggle('active', b === btn));
    buzz(5);
    renderHistory();
  });

  /* =========================================================
     Card taps → attendance (card) / history (name)
     ========================================================= */
  listEl.addEventListener('click', (ev) => {
    const card = ev.target.closest('.card');
    if (!card) return;
    const nameEl = ev.target.closest('.name');

    if (nameEl && card.contains(nameEl)) {
      buzz(6);
      openHistory(card.dataset.id);
      return;
    }
    buzz(6);
    openAttendance(card.dataset.id);
  });

  /* =========================================================
     Date navigation
     ========================================================= */
  prevDayBtn.addEventListener('click', () => {
    currentDate = shiftDate(currentDate, -1);
    buzz(5);
    render();
  });
  nextDayBtn.addEventListener('click', () => {
    if (currentDate >= dateKey()) return;
    currentDate = shiftDate(currentDate, 1);
    buzz(5);
    render();
  });

  /* =========================================================
     Search
     ========================================================= */
  $('#search').addEventListener('input', (ev) => {
    searchQuery = ev.target.value;
    renderList();
  });

  /* =========================================================
     CSV export (current day)
     ========================================================= */
  $('#exportBtn').addEventListener('click', () => {
    if (!db.employees.length) { toast('No employees to export'); return; }

    const day = db.records[currentDate] || {};
    const rows = [['Date', 'Name', 'Position', 'Status', 'Time', 'Note / Reason']];

    db.employees
      .slice()
      .sort((a, b) => a.name.localeCompare(b.name))
      .forEach(e => {
        const r = day[e.id];
        rows.push([
          currentDate,
          e.name,
          e.role || '',
          r ? STATUS[r.status].label : 'Not marked',
          r && r.time ? formatTime(r.time) : '',
          (r && r.reason) || ''
        ]);
      });

    const csv = rows
      .map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','))
      .join('\r\n');

    try {
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `attendance-${currentDate}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1500);
      toast('CSV exported');
      buzz(12);
    } catch (err) {
      toast('Export not supported here');
    }
  });

  /* =========================================================
     Live clock
     ========================================================= */
  function tickClock() {
    const d = new Date();
    let h = d.getHours();
    const ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    clockEl.textContent =
      `${h}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')} ${ap}`;
  }

  /* =========================================================
     Boot
     ========================================================= */
  function init() {
    loadData();
    currentDate = dateKey();
    render();
    tickClock();
    setInterval(tickClock, 1000);

    // Roll the date over automatically at midnight
    let lastKey = dateKey();
    setInterval(() => {
      const k = dateKey();
      if (k !== lastKey) {
        lastKey = k;
        if (currentDate !== k) { currentDate = k; render(); }
      }
    }, 30000);
  }

  init();
})();
</script>
</body>
</html>
